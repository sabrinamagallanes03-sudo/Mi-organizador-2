name: Crear APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Crear proyecto
        run: |
          mkdir -p app/src/main/java/com/miorganizador/dos
          echo "plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' } android { namespace 'com.miorganizador.dos'; compileSdk 34; defaultConfig { applicationId 'com.miorganizador.dos'; minSdk 24; targetSdk 34; versionCode 2; versionName '2.0' } } dependencies { implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.appcompat:appcompat:1.6.1' }" > app/build.gradle
          echo "plugins { id 'com.android.application' version '8.2.0' apply false; id 'org.jetbrains.kotlin.android' version '1.9.10' apply false }"> build.gradle
          echo "include ':app'"> settings.gradle
          mkdir -p app/src/main
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Mi Organizador 2.0"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          echo 'package com.miorganizador.dos; import android.os.Bundle; import androidx.appcompat.app.AppCompatActivity; import android.widget.*; class MainActivity: AppCompatActivity(){ override fun onCreate(b: Bundle?){ super.onCreate(b); val l=LinearLayout(this).apply{orientation=1; setPadding(50,100,50,50)}; val t=TextView(this).apply{text="Mi Organizador 2.0\nPRO V2"; textSize=24f}; val e=EditText(this).apply{hint="Proyecto"}; val bt=Button(this).apply{text="Guardar"}; val lv=TextView(this); l.addView(t); l.addView(e); l.addView(bt); l.addView(lv); setContentView(l) } }' > app/src/main/java/com/miorganizador/dos/MainActivity.kt
          gradle wrapper
      - name: Compilar APK
        run: ./gradlew assembleDebug
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Mi-Organizador-2
          path: app/build/outputs/apk/debug/*.apk
